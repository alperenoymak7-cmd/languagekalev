<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6th Grade English Unit Portal - Interactive Game Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        .bounce-hover {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bounce-hover:hover {
            transform: translateY(-5px);
        }
        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22);
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 82vh;
            min-height: 600px;
            background: #0f172a;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Top Navigation / Sticky Header -->
    <header class="bg-indigo-700 text-white shadow-lg p-3.5 md:px-6 sticky top-0 z-50 border-b-4 border-indigo-900">
        <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-3">
            <!-- Brand Logo & Title -->
            <div onclick="showHome()" class="flex items-center gap-3 cursor-pointer group">
                <span class="text-2xl md:text-3xl bg-indigo-800 group-hover:bg-indigo-600 p-2.5 rounded-2xl border-2 border-indigo-400 shadow-inner transition-colors">
                    <i class="fa-solid fa-gamepad text-yellow-300"></i>
                </span>
                <div>
                    <h1 class="text-lg md:text-2xl font-bold leading-none tracking-wide">6th Grade English Grammar Portal</h1>
                    <p class="text-xs text-indigo-200 font-semibold mt-1">
                        <i class="fa-solid fa-wand-magic-sparkles text-yellow-300 mr-1"></i>Interactive Quiz & Paragraph Builder Hub (Topics 1–10)
                    </p>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex items-center gap-2 flex-
